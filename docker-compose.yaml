# Production stack — deployed as a single Coolify "Docker Compose" resource.
#
# Coolify supplies the environment variables below and terminates TLS via
# Traefik. Nothing is published to the host: the database is reachable only as
# `db:5432` on the compose network, and the two apps are reached through
# Traefik on one origin (`/api` -> backend, everything else -> frontend), which
# is what keeps the JWT cookie and SSR auth forwarding working.
services:
  db:
    # Pinned deliberately: a major-version bump refuses to start against an
    # existing data directory. Match the version running in production.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - metro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # Prebuilt by .github/workflows/publish.yml. No `build:` key here on
    # purpose — it is what stops the deployment host from compiling the app.
    # Use docker-compose.build.yaml to build locally.
    image: ghcr.io/c4g/metro-atlanta-saves-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVICE_FQDN_BACKEND_3000: /api
      NODE_ENV: production
      API_PORT: 3000
      UPLOAD_DIR: /data/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USER: ${MAIL_USER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      # Private uploads (images/, discussion-images/) — backend only.
      - mas-private:/data/uploads
      # Public assets mounted *on top of* the private volume, so application
      # code still sees one tree under UPLOAD_DIR.
      - mas-assets:/data/uploads/assets
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/c4g/metro-atlanta-saves-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_FRONTEND_4000: /
      NODE_ENV: production
      FE_PORT: 4000
      SHARED_ASSETS_DIR: /data/assets
    volumes:
      # Public assets only, read-only. The frontend has no filesystem path to
      # private uploads at all — that is the security boundary.
      - mas-assets:/data/assets:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mas-private:
  mas-assets:
  metro-db-data:
