services:
  metro-db:
    image: postgres
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - metro-db-data:/var/lib/postgresql
volumes:
  metro-db-data:
