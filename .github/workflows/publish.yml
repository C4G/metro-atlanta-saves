name: Publish Images

# Builds both application images and pushes them to GHCR so the deployment
# target pulls a finished image instead of compiling on the server. The first
# deploy attempt failed because `pnpm install` on the shared Coolify host was
# taking 10-38s per registry request; building here removes that dependency
# and keeps a ~2GB build off a box running other applications.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be lowercase — GHCR rejects mixed-case image names, and the org is "C4G".
  IMAGE_BASE: ghcr.io/c4g/metro-atlanta-saves

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both targets share the base/deps/build stages, so they are built in one
      # job: the frontend reuses the layers the backend just produced instead of
      # repeating `pnpm install` and the Nx builds.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:latest
            ${{ env.IMAGE_BASE }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:latest
            ${{ env.IMAGE_BASE }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ''
            echo '```'
            echo "${IMAGE_BASE}-backend:latest"
            echo "${IMAGE_BASE}-backend:${GITHUB_SHA}"
            echo "${IMAGE_BASE}-frontend:latest"
            echo "${IMAGE_BASE}-frontend:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploying from here (rather than letting Coolify redeploy on git push)
      # avoids a race where Coolify pulls `:latest` before this workflow has
      # finished pushing it. Skipped automatically until the secret exists.
      # The secret is surfaced through `env` because the `secrets` context is
      # not available in a step-level `if:`.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
