name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub only shares caches downward from the default branch, and a cache
  # saved on refs/pull/N/merge is invisible to every other PR. Without a run on
  # main there is nothing for PRs to restore, so each one re-downloads the whole
  # pnpm store. This run exists to seed that cache.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # Credentials for the throwaway Postgres service below. The database is
  # created and destroyed with the job and is never reachable from outside the
  # runner, so these are deliberately literals rather than repository secrets.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: metro_atlanta_saves
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metro_atlanta_saves?schema=public
  # Authenticates against the workspace in nx.json's nxCloudId, enabling remote
  # caching. Runs from forks get an empty value and fall back to local caching.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_DAEMON: 'false'

jobs:
  main:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metro_atlanta_saves
        ports:
          - 5432:5432
        # Replaces the manual pg_isready polling the self-hosted job needed:
        # the job does not start until this reports healthy.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Full history so `nx affected --base=origin/main` can diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations and seed
        run: |
          pnpm exec nx run backend:prisma-generate
          pnpm exec nx run backend:prisma-migrate
          pnpm exec nx run backend:prisma-seed

      - name: Lint, build, test
        run: pnpm exec nx affected -t lint,build,test --base=origin/main --head=HEAD --parallel=3 --configuration=production

      # E2E is not wired up yet. Enabling it needs a browser install plus the
      # runtime variables the app reads at boot — JWT_SECRET (required, the API
      # throws without it) and API_PORT / FE_PORT:
      #
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps
      # - name: E2E
      #   env:
      #     JWT_SECRET: ci-only-not-a-real-secret
      #     API_PORT: 3000
      #     FE_PORT: 4200
      #   run: pnpm exec nx affected -t e2e --base=origin/main --head=HEAD --configuration=production
