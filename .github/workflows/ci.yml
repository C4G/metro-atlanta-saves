name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub only shares caches downward from the default branch, and a cache
  # saved on refs/pull/N/merge is invisible to every other PR. Without a run on
  # main there is nothing for PRs to restore, so each one re-downloads the whole
  # pnpm store. This run exists to seed that cache.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # The E2E Nx Agent starts its own disposable PostgreSQL instance.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metro_atlanta_saves?schema=public
  E2E_SETUP_DATABASE: 'true'
  CI: 'true'
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
  BETTER_AUTH_URL: http://localhost:3000
  API_PORT: 3000
  FE_PORT: 4200
  # Authenticates against the workspace in nx.json's nxCloudId, enabling remote
  # caching. Runs from forks get an empty value and fall back to local caching.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_DAEMON: 'false'

jobs:
  main:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      # Full history so `nx affected --base=origin/main` can diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep E2E prerequisites on the same runner that executes the affected
      # targets.  Delegating tasks to ephemeral Nx agents made this workflow
      # depend on agent image state and caused non-code CI failures.
      - name: Install PostgreSQL for E2E
        run: bash apps/e2e/setup-postgres.sh

      - name: Install Playwright browsers for E2E
        run: pnpm exec playwright install --with-deps

      - name: Affected lint, build, unit tests, and E2E
        run: pnpm exec nx affected -t lint,build,test,e2e-ci --base=origin/main --head=HEAD --configuration=production
